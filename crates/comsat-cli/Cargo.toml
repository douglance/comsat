[package]
name = "comsat-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "comsat"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
comsat-app = { path = "../comsat-app" }
comsat-engine = { path = "../comsat-engine" }
comsat-source = { path = "../comsat-source" }
comsat-store = { path = "../comsat-store" }
comsat-store-sqlite = { path = "../comsat-store-sqlite" }
comsat-types = { path = "../comsat-types" }
comsat-github = { path = "../../plugins/github" }
comsat-hacker-news = { path = "../../plugins/hacker-news" }
comsat-stack-exchange = { path = "../../plugins/stack-exchange" }
comsat-web = { path = "../../plugins/web" }
futures.workspace = true
http.workspace = true
incurs = { workspace = true, features = ["cli", "mcp", "http", "agent-plugins-mcp"] }
incurs-codemode.workspace = true
incurs-codemode-local.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread", "time"] }
tokio-util.workspace = true

[lints]
workspace = true
