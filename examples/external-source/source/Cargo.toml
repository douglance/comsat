[package]
name = "comsat-fixture-source"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
comsat-types = { path = "../../../crates/comsat-types" }
incurs = { git = "https://github.com/douglance/incurs", rev = "8b1a6c400b2eb65ee379e099c1d7bd96525f536a", default-features = false, features = ["cli", "mcp"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
